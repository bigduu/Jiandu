name: Rust CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Rust 1.95 workspace contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install declared minimum Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
      - name: Test workspace on Rust 1.95
        run: cargo test --workspace --all-targets --all-features --locked

  workspace:
    name: Jiandu workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Validate locked workspace metadata
        run: cargo metadata --locked --all-features --format-version 1
      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run tests and schema drift checks
        run: cargo test --workspace --all-features --locked

  windows-runtime:
    name: Jiandu workspace Windows runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run workspace tests
        run: cargo test --workspace --all-features --locked
