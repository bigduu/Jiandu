name: Rust CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace:
    name: core contracts and canonical store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Validate locked workspace metadata
        run: cargo metadata --locked --no-deps --format-version 1
      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run tests and schema drift checks
        run: cargo test --workspace --all-features --locked

  store-windows-runtime:
    name: canonical store Windows runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run canonical store tests
        run: cargo test -p jiandu-store --all-features --locked
