[workspace]
members = ["crates/jiandu-memory", "crates/jiandu-mcp"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/bigduu/Jiandu"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
rmcp = { version = "3.1.4", default-features = false, features = ["macros", "server"] }
schemars = { version = "1.2.2", features = ["preserve_order"] }
tempfile = "3.27.0"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync"] }
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
