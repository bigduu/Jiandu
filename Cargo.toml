[workspace]
members = [
    "crates/jiandu-core",
    "crates/jiandu-bamboo-import",
    "crates/jiandu-store",
    "crates/jiandu-index",
    "crates/jiandu-mcp",
    "crates/jiandu-service",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/bigduu/Jiandu"

[workspace.dependencies]
axum = { version = "0.8.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.23.1"
hmac = "0.13.0"
http-body = "1.0.1"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "serialize"] }
rmcp = { version = "3.1.4", default-features = false, features = ["macros", "server"] }
schemars = { version = "1.2.2", features = ["preserve_order"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
subtle = "2.6.1"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.48.0", features = ["io-util", "macros", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7.17", features = ["rt"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.25.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
