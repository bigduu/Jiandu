[package]
name = "jiandu-mcp"
description = "Stdio MCP server for the Jiandu shared memory system"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
dashmap.workspace = true
jiandu-memory = { version = "0.2.0", path = "../jiandu-memory" }
rmcp = { workspace = true, features = ["transport-io"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }

[dev-dependencies]
rmcp = { workspace = true, features = ["client"] }
tempfile.workspace = true

[lints]
workspace = true
